name: Build Zalith Haptic Vibe Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Minecraft 1.21.1 Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Make Gradle wrapper executable (if present)
        run: chmod +x ./gradlew || true

      - name: Build Mod with Gradle
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload compiled Fabric .jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: zalith-vibe-1.21.1-fabric
          path: build/libs/*.jar
          if-no-files-found: error
